<text x="511.00" y="176.00" class="t2" text-anchor="start">  file intere: 4 x 2</text>
<text x="511.00" y="184.00" class="t2" text-anchor="start">  taglio in fondo: 30 cm</text>
<text x="511.00" y="192.00" class="t2" text-anchor="start">  taglio lato cameretta: 64 cm</text>
<text x="511.00" y="200.00" class="t2" text-anchor="start">  taglio fondo nicchia: 49 cm</text>
<text x="511.00" y="208.00" class="t2" text-anchor="start">  lastre (+15%): 10</text>
<text x="511.00" y="216.00" class="t2" text-anchor="start"></text>
<text x="511.00" y="224.00" class="t3" text-anchor="start">RIVESTIMENTO h 240 cm</text>
<text x="511.00" y="232.00" class="t2" text-anchor="start">  12.86 m x 2.40 m - vuoti</text>
<text x="511.00" y="240.00" class="t2" text-anchor="start">  = 28.73 mq</text>
<text x="511.00" y="248.00" class="t2" text-anchor="start">  3 corsi da 80, l'ultimo tagliato</text>
<text x="511.00" y="256.00" class="t2" text-anchor="start">  spessore in opera: 2 cm</text>
<text x="511.00" y="264.00" class="t2" text-anchor="start">  lastre (+15%): 41</text>
<text x="511.00" y="272.00" class="t2" text-anchor="start"></text>
<text x="511.00" y="280.00" class="t3" text-anchor="start">TOTALE 51 lastre = 41.3 mq</text>
<text x="14.00" y="382.00" class="t2" text-anchor="start">Rivestimento interno 2 cm (piastrella + colla) su tutte le pareti: misure FINITE 154 x 391 cm contro 158 x 395 al grezzo. Tutte le quote e l'arredo si riferiscono al finito.</text>
<text x="14.00" y="393.00" class="t2" text-anchor="start">Sanitari accentrati sul tratto libero 2-287: interasse wc-bidet 45 cm, luce laterale 27 cm. Wc e bidet sospesi, profondi 48. Passaggio libero 106 cm per tutto il vano.</text>
<text x="14.00" y="404.00" class="t2" text-anchor="start">Box a nicchia 154: anta scorrevole a 2 pannelli, 120 da chiusa e 60 da aperta, + fisso 34. Luce netta di accesso alla doccia 60 cm.</text>
<text x="14.00" y="415.00" class="t2" text-anchor="start">Piatto doccia 154x80 su misura a filo colonna di scarico; nicchia 23x74 sotto la finestra da tamponare (seduta h 45). Porta 80x210 a scomparsa: parete finita min. 12,5 cm.</text>
<text x="14.00" y="426.00" class="t2" text-anchor="start">Colonna montante di scarico nell'angolo di fondo, dietro al piatto: dal wc lo scarico corre ~2 m sotto pavimento (verificare pendenza e massetto).</text>

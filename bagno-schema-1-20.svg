<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="28cm" height="20cm" viewBox="0 0 560 400">
  <!-- 1 unita' SVG = 1 cm reale. Stampa 100% su A4 orizzontale => scala 1:20 -->
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#9aa5b1" stroke-width="1"/>
    </pattern>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <line x1="1" y1="7" x2="7" y2="1" stroke="#444" stroke-width="1"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
      .t1 { font-size: 11px; font-weight: bold; }
      .t2 { font-size: 7px; }
      .lbl { font-size: 6px; }
      .lbls { font-size: 5px; fill: #555; }
      .lblw { font-size: 5px; fill: #ffffff; }
      .dim { font-size: 5.5px; fill: #333; }
      .dl { stroke: #666; stroke-width: 0.6; }
      .ext { stroke: #999; stroke-width: 0.4; stroke-dasharray: 3 2; }
      .fix { fill: #ffffff; stroke: #1f5673; stroke-width: 1.2; }
      .fixl { fill: none; stroke: #1f5673; stroke-width: 0.8; }
    </style>
  </defs>

  <rect x="0" y="0" width="560" height="400" fill="#ffffff"/>

  <text class="t1" x="14" y="16">BAGNO - ipotesi di arredo in scala 1:20</text>
  <text class="t2" x="14" y="28">Rilievo da TAV 02 "Stato di progetto" - vano netto 1,58 x 3,95 m (6,75 mq) con nicchia 0,90 x 0,75 m</text>

  <g transform="translate(70,110)">

    <!-- ===================== MURATURE ===================== -->
    <path d="M -12,-12 L 423,-12 L 423,170 L 102,170 L 102,245 L -12,245 Z" fill="#4a4a4a"/>
    <!-- vano interno -->
    <path d="M 0,0 L 395,0 L 395,27 L 369,27 L 369,80 L 392,80 L 392,158 L 90,158 L 90,233 L 0,233 Z"
          fill="#ffffff" stroke="#4a4a4a" stroke-width="0.5"/>
    <!-- muro nuovo da 12 cm (verde come da tavola) -->
    <rect x="-12" y="-12" width="435" height="12" fill="#00b050" opacity="0.85"/>
    <!-- sguincio finestrella -->
    <rect x="392" y="80" width="31" height="51" fill="#ffffff" stroke="#4a4a4a" stroke-width="0.5"/>
    <line x1="423" y1="80" x2="423" y2="131" stroke="#1f5673" stroke-width="2"/>
    <text class="lblw" x="405" y="105" text-anchor="middle" transform="rotate(-90 405 105)">FINESTRA 0,51</text>

    <!-- vano porta -->
    <rect x="-12" y="50" width="12" height="85" fill="#ffffff"/>
    <path d="M 80,135 A 80,80 0 0 0 0,55" fill="none" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="4 3"/>
    <line x1="0" y1="135" x2="80" y2="135" stroke="#c0392b" stroke-width="2.5"/>
    <text class="lbls" x="-19" y="92" text-anchor="middle" transform="rotate(-90 -19 92)">PORTA 0,80</text>

    <!-- ===================== SANITARI ===================== -->
    <!-- mobile lavabo 120 x 50 -->
    <rect class="fix" x="5" y="0" width="120" height="50"/>
    <rect class="fixl" x="12" y="6" width="106" height="38" rx="4"/>
    <circle class="fixl" cx="65" cy="25" r="3"/>
    <text class="lbl" x="65" y="30" text-anchor="middle">MOBILE LAVABO</text>
    <text class="lbl" x="65" y="38" text-anchor="middle">120 x 50</text>

    <!-- wc 37 x 55 -->
    <rect class="fix" x="145" y="0" width="37" height="55" rx="3"/>
    <rect class="fixl" x="145" y="0" width="37" height="14"/>
    <ellipse class="fixl" cx="163.5" cy="35" rx="14" ry="17"/>
    <text class="lbl" x="163.5" y="66" text-anchor="middle">WC 37x55</text>

    <!-- bidet 37 x 55 -->
    <rect class="fix" x="190" y="0" width="37" height="55" rx="3"/>
    <ellipse class="fixl" cx="208.5" cy="30" rx="14" ry="20"/>
    <text class="lbl" x="208.5" y="66" text-anchor="middle">BIDET 37x55</text>

    <!-- piatto doccia 158 x 80 -->
    <rect x="289" y="0" width="80" height="158" fill="#dff1fb" stroke="#1f5673" stroke-width="1.2"/>
    <circle class="fixl" cx="329" cy="79" r="4"/>
    <line x1="289" y1="0" x2="289" y2="158" stroke="#1f5673" stroke-width="3"/>
    <line x1="289" y1="0" x2="289" y2="52" stroke="#ffffff" stroke-width="1.6"/>
    <text class="lbl" x="329" y="76" text-anchor="middle" transform="rotate(-90 329 76)">PIATTO DOCCIA 158 x 80</text>
    <text class="lbls" x="284" y="110" text-anchor="middle" transform="rotate(-90 284 110)">box: anta scorrevole</text>

    <!-- nicchia residua sotto finestra -->
    <rect x="369" y="80" width="23" height="78" fill="url(#hatch)" stroke="#9aa5b1" stroke-width="0.6"/>
    <text class="lbls" x="380" y="119" text-anchor="middle" transform="rotate(-90 380 119)">seduta/mensola 23x78</text>

    <!-- pilastrino esistente -->
    <text class="lblw" x="383" y="55" text-anchor="middle" transform="rotate(-90 383 55)">pilastro esist.</text>

    <!-- nicchia ingresso: lavatrice / colonna -->
    <rect class="fix" x="15" y="173" width="60" height="60"/>
    <circle class="fixl" cx="45" cy="203" r="19"/>
    <text class="lbl" x="45" y="206" text-anchor="middle">LAVATRICE</text>
    <text class="lbl" x="45" y="214" text-anchor="middle">60 x 60</text>

    <!-- ===================== QUOTE ===================== -->
    <!-- catena superiore -->
    <g>
      <line class="ext" x1="0" y1="-4" x2="0" y2="-40"/>
      <line class="ext" x1="125" y1="-4" x2="125" y2="-40"/>
      <line class="ext" x1="145" y1="-4" x2="145" y2="-40"/>
      <line class="ext" x1="227" y1="-4" x2="227" y2="-40"/>
      <line class="ext" x1="289" y1="-4" x2="289" y2="-40"/>
      <line class="ext" x1="369" y1="-4" x2="369" y2="-40"/>
      <line class="ext" x1="395" y1="-4" x2="395" y2="-64"/>

      <line class="dl" x1="0" y1="-38" x2="125" y2="-38" marker-start="url(#tick)" marker-end="url(#tick)"/>
      <line class="dl" x1="125" y1="-38" x2="145" y2="-38" marker-end="url(#tick)"/>
      <line class="dl" x1="145" y1="-38" x2="227" y2="-38" marker-end="url(#tick)"/>
      <line class="dl" x1="227" y1="-38" x2="289" y2="-38" marker-end="url(#tick)"/>
      <line class="dl" x1="289" y1="-38" x2="369" y2="-38" marker-end="url(#tick)"/>
      <line class="dl" x1="369" y1="-38" x2="395" y2="-38" marker-end="url(#tick)"/>

      <text class="dim" x="62" y="-41" text-anchor="middle">125</text>
      <text class="dim" x="135" y="-41" text-anchor="middle">20</text>
      <text class="dim" x="186" y="-41" text-anchor="middle">82 (wc+bidet)</text>
      <text class="dim" x="258" y="-41" text-anchor="middle">62 accesso</text>
      <text class="dim" x="329" y="-41" text-anchor="middle">80 doccia</text>
      <text class="dim" x="382" y="-41" text-anchor="middle">26</text>

      <line class="ext" x1="0" y1="-40" x2="0" y2="-64"/>
      <line class="dl" x1="0" y1="-62" x2="395" y2="-62" marker-start="url(#tick)" marker-end="url(#tick)"/>
      <text class="dim" x="197" y="-65" text-anchor="middle">395  (lunghezza netta del vano)</text>
    </g>

    <!-- quota larghezza -->
    <g>
      <line class="ext" x1="-4" y1="0" x2="-38" y2="0"/>
      <line class="ext" x1="-4" y1="158" x2="-38" y2="158"/>
      <line class="dl" x1="-36" y1="0" x2="-36" y2="158" marker-start="url(#tick)" marker-end="url(#tick)"/>
      <text class="dim" x="-39" y="79" text-anchor="middle" transform="rotate(-90 -39 79)">158</text>
    </g>

    <!-- quote nicchia ingresso -->
    <g>
      <line class="dl" x1="0" y1="240" x2="90" y2="240" marker-start="url(#tick)" marker-end="url(#tick)"/>
      <text class="dim" x="45" y="238" text-anchor="middle">90</text>
      <line class="dl" x1="84" y1="158" x2="84" y2="233" marker-start="url(#tick)" marker-end="url(#tick)"/>
      <text class="dim" x="81" y="196" text-anchor="middle" transform="rotate(-90 81 196)">75</text>
    </g>

    <!-- passaggio libero -->
    <line class="dl" x1="200" y1="55" x2="200" y2="158" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <text class="dim" x="197" y="107" text-anchor="middle" transform="rotate(-90 197 107)">103 passaggio</text>

    <!-- contesto -->
    <text class="lbls" x="200" y="-16" text-anchor="middle">muro nuovo 12 cm  -  CAMERA MATRIMONIALE</text>
    <text class="lblw" x="240" y="167" text-anchor="middle">CAMERETTA</text>
    <text class="lbls" x="-19" y="200" text-anchor="middle" transform="rotate(-90 -19 200)">DISIMPEGNO</text>
    <text class="lblw" x="415" y="40" text-anchor="middle" transform="rotate(-90 415 40)">BALCONE</text>
  </g>

  <!-- note -->
  <text class="t2" x="14" y="372">Interasse wc-bidet 45 cm - luce libera laterale &gt;= 20 cm - spazio frontale sanitari 103 cm - accesso doccia 62 cm. Finestra 0,51 x 0,89 con davanzale a 1,35 m (ricade nel box doccia).</text>
  <text class="t2" x="14" y="384">Piatto doccia su misura 158x80 a filo del pilastro; la nicchia 23x78 sotto la finestra va tamponata (seduta/mensola h 45) oppure inclusa in un piatto sagomato.</text>
  <text class="t2" x="14" y="396">Porta 0,80 con apertura verso l'interno lato nicchia (non interferisce con il mobile lavabo): valutare scorrevole esterno muro.</text>
</svg>
